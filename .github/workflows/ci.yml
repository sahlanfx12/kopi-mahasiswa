name: Kopi Mahasiswa CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kopi_mahasiswa_test
          MYSQL_USER: kopi_test
          MYSQL_PASSWORD: kopi_test_only_password
          MYSQL_ROOT_PASSWORD: kopi_test_root_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ukopi_test -pkopi_test_only_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: curl, dom, mbstring, mysqli, openssl, xml, xmlwriter
          coverage: none

      - name: Install locked dependencies without scripts or plugins
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Verify PHPUnit version
        run: |
          version="$(vendor/bin/phpunit --version)"
          echo "$version"
          [[ "$version" =~ ^PHPUnit\ 10\.5\. ]]

      - name: Run Unit and Integration Tests
        env:
          PHPUNIT_AUTOLOAD: "${{ github.workspace }}/vendor/autoload.php"
          KM_TEST_DB_NAME: kopi_mahasiswa_test
          KM_TEST_DB_HOST: 127.0.0.1
          KM_TEST_DB_PORT: "3306"
          KM_TEST_DB_USER: kopi_test
          KM_TEST_DB_PASSWORD: kopi_test_only_password
        run: composer test
